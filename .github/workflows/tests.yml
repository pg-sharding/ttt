name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  regress:
    name: regress
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ['14', '15', '16', '17', '18']

    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Run tests
        run: |
          docker build . --file docker/regress/Dockerfile --build-arg=PG_VERSION=${{ matrix.version }} --tag ttt-regress:${{ matrix.version }}
          docker run ttt-regress:${{ matrix.version }}

  regress-cassert:
    name: regress-cassert
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ['14', '15', '16', '17', '18']

    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Run tests
        run: |
          docker build . --file docker/regress/Dockerfile.cpg --build-arg=PG_MAJOR=${{ matrix.version }} --tag ttt-regress-cassert:${{ matrix.version }}
          docker run ttt-regress-cassert:${{ matrix.version }}

  odyssey:
    name: odyssey pg_regress
    runs-on: ubuntu-latest

    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Clone odyssey
        run: git clone --depth 1 https://github.com/yandex/odyssey odyssey

      - name: Build the Docker image
        run: docker build . --file docker/regress/Dockerfile.odyssey --tag ttt-regress-odyssey:1234

      - name: Run tests
        run: docker run ttt-regress-odyssey:1234

  xproto:
    name: xproto
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ['17', '18']

    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install PostgreSQL
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.version }} postgresql-server-dev-${{ matrix.version }}

      - name: Build and install the extension
        run: |
          make USE_PGXS=1 PG_CONFIG=/usr/lib/postgresql/${{ matrix.version }}/bin/pg_config
          sudo make USE_PGXS=1 PG_CONFIG=/usr/lib/postgresql/${{ matrix.version }}/bin/pg_config install

      - name: Run xproto test
        run: |
          export PATH=/usr/lib/postgresql/${{ matrix.version }}/bin:$PATH
          initdb -D /tmp/pgdata -U postgres --auth=trust
          pg_ctl -D /tmp/pgdata -l /tmp/pgdata/postmaster.log -o "-p 5437 -k /tmp" -w start
          cd test/xproto && go test -v .
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5437
          PGUSER: postgres
          PGDATABASE: postgres
