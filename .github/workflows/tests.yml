name: Regression tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  regress:
    name: Regression tests

    strategy:
      matrix:
        version: ['18', '19']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file docker/regress/Dockerfile --build-arg=PG_VERSION=${{ matrix.version }} --tag regress_test:1234
    - name: Run tests
      run: docker run regress_test:1234
